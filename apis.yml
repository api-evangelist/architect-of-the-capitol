x-contract-verification:
  checked: '2026-09-06'
  method: probed
  finding: >-
    The OpenAPI definitions held in this repository (openapi/_original/aoc-data-api.yaml and the
    five refined per-tag documents derived from it) were NOT harvested from the Architect of the
    Capitol. Every one declares servers[0].url https://api.aoc.gov/v1, and api.aoc.gov returns
    NXDOMAIN — no A record, no CNAME, no NS delegation — so the host has never existed. No
    /openapi.json, /swagger.json, /api-docs, GraphQL, MCP or AsyncAPI surface was found on any
    aoc.gov host either. These specs are unmarked scaffolds from an earlier bulk sweep and nothing
    in this enrichment pass was derived from them.
  evidence:
  - check: dig api.aoc.gov
    result: NXDOMAIN
  - url: https://api.aoc.gov/openapi.json
    status: 0
    note: connection failed, host does not resolve
  - url: https://www.aoc.gov/developers
    status: 404
  - url: https://www.aoc.gov/api
    status: 404
  - url: https://www.aoc.gov/.well-known/api-catalog
    status: 404
  related: The only machine-readable surface bearing the AOC name is the "Architect of the Capitol"
    jurisdiction boundary layer on catalog.data.gov, which is served from maps2.dcgis.dc.gov and
    opendata.dc.gov and is published by DC GIS (District of Columbia OCTO), not by the Architect of
    the Capitol. It fails the ownership check and was deliberately not saved as an AOC contract.

x-coverage:
  state: none
  reason: no-developer-program
  detail: >-
    The Architect of the Capitol is a legislative-branch construction and preservation agency with
    no developer program at all — www.aoc.gov/developers and /api both return 404, there is no
    pricing, portal or reference page anywhere in its 1,092-URL sitemap, and api.aoc.gov (the host
    named in the scaffolded OpenAPIs this repo holds) does not resolve in DNS.
  evidence:
