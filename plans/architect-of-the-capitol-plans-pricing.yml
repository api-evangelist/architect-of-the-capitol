description: >-
  The Architect of the Capitol publishes no API plans, tiers, quotas or pricing of any kind.
  It is a legislative-branch federal agency with no developer program: www.aoc.gov/developers
  and www.aoc.gov/api both return 404, no pricing or plans page exists anywhere on the site,
  and the API host named in this repo's OpenAPI servers[] block (api.aoc.gov) does not resolve
  (NXDOMAIN, checked 2026-09-06). An honest zero.
