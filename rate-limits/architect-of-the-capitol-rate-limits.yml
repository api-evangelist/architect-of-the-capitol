description: >-
  The Architect of the Capitol documents no rate limits, quotas, throttling behaviour or
  rate-limit response headers. There is no developer program and no reachable API host to observe
  headers on: api.aoc.gov returns NXDOMAIN (checked 2026-09-06), and www.aoc.gov/developers,
  /api and /.well-known/api-catalog all return 404. An honest zero.
